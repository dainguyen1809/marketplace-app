# Custom log format for development environment
# Shows client IP, timestamp, request, status, response time, and upstream response time
log_format dev_format '$remote_addr - [$time_local] "$request" $status ${request_time}s ($upstream_response_time)';

server {
    # Listen on port 80 for HTTP traffic
    listen 80;
    server_name localhost;
    # Document root for the application
    root /var/www/html/public;
    index index.php index.html;

    # Log access to stdout using custom format, errors to stderr with warn level
    access_log /dev/stdout dev_format;
    error_log /dev/stderr warn;

    # Maximum allowed size for client request bodies (32MB)
    client_max_body_size 32m;

    # Security headers to protect against common vulnerabilities
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Enable gzip compression for specified content types
    gzip on;
    gzip_types application/json text/plain text/css application/javascript text/xml;
    # Minimum length of response to compress (256 bytes)
    gzip_min_length 256;

    # Main location block - try to serve static files, fallback to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets for 30 days, disable access logging for performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Process PHP files through PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # Read timeout for FastCGI responses (3 minutes)
        fastcgi_read_timeout 180;
    }

    # Deny access to hidden files (like .htaccess, .git, etc.) except well-known paths
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Custom error handling for 5xx errors - return JSON response
    error_page 500 502 503 504 @json_error;
    location @json_error {
        default_type application/json;
        return 502 '{"success": false, "message": "Service temporarily unavailable. Please try again later."}';
    }
}
